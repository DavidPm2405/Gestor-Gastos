{% extends "base.html" %}
{% block title %}Nueva Contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card p-4">
      <h5 class="mb-4 text-center fw-bold">Nueva contraseña</h5>
      <form method="POST">
        <div class="mb-4">
          <label class="form-label">Nueva contraseña <span class="text-muted small">(mín. 6 caracteres)</span></label>
          <input type="password" name="password" class="form-control" required autofocus>
        </div>
        <button class="btn btn-primary w-100">Guardar contraseña</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
