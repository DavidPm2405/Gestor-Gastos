{% extends "base.html" %}
{% block title %}Recuperar Contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card p-4">
      <h5 class="mb-1 text-center fw-bold">¿Olvidaste tu contraseña?</h5>
      <p class="text-muted text-center small mb-4">Te enviaremos un link para restablecerla.</p>
      <form method="POST">
        <div class="mb-4">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required autofocus placeholder="tucorreo@gmail.com">
        </div>
        <button class="btn btn-primary w-100">Enviar instrucciones</button>
      </form>
      <p class="text-center mt-3 mb-0 text-muted small">
        <a href="{{ url_for('login') }}">Volver al login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
